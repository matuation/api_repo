plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
    id 'io.freefair.lombok' version "9.2.0"

}

repositories {
    mavenCentral()
}

def restAssuredVersion = "5.5.0",
        selenideVersion = "7.13.0",
    allureVersion = "2.12.0",
        ownerVersion = "1.0.12",
    junitVersion = "5.14.3",
    slf4jVersion = "2.0.17"

allure {
    report {
        version.set(allureVersion)
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjweaver = true //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set(allureVersion) //версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    testImplementation(
            "io.rest-assured:rest-assured:$restAssuredVersion",
            "io.rest-assured:json-schema-validator:$restAssuredVersion",
            "io.qameta.allure:allure-rest-assured:$allureVersion",
            "io.qameta.allure:allure-selenide:$allureVersion",
            "com.fasterxml.jackson.core:jackson-databind:2.18.2",
            "net.datafaker:datafaker:2.5.4",
            "org.assertj:assertj-core:3.27.7",
            "org.junit.jupiter:junit-jupiter:$junitVersion",
            "org.slf4j:slf4j-simple:$slf4jVersion",
            "com.codeborne:selenide:$selenideVersion",
            "org.aeonbits.owner:owner:$ownerVersion"
    )
}

tasks.withType(Test) {
    useJUnitPlatform()
    // Прокидываем системные свойства (для Owner)
    systemProperties(System.getProperties())

    // Принудительная кодировка UTF-8
    systemProperty "file.encoding", "UTF-8"
    jvmArgs "-Dfile.encoding=UTF-8"

    testLogging {
        showStandardStreams = true
        lifecycle {
            events "started", "skipped", "failed"
            exceptionFormat "full"
        }
    }
}
// Задача для запуска API (исключаем комбинированные тесты)
task runApiTests(type: Test) {
    group = 'verification'
    useJUnitPlatform {
        excludeTags 'API+UI'
    }
}

// Задача для запуска UI (только комбинированные тесты)
task runUiTests(type: Test) {
    group = 'verification'
    useJUnitPlatform {
        includeTags 'API+UI'
    }
}